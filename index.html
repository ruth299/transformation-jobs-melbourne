<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Transformation Jobs Melbourne
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    />
</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <header class="header">

            <div class="live-badge">
                ● LIVE JOBS
            </div>

            <h1 class="title">
                Transformation Jobs Melbourne
            </h1>

            <p class="subtitle">
                ERP, Delivery, Program,
                Business Analysis &
                Technology Transformation
                roles in Melbourne
            </p>

        </header>


        <!-- DASHBOARD STATS -->

        <section class="stats-section">

            <div class="stat-card">
                <h2 id="jobCount">
                    0
                </h2>
                <p>Total Jobs</p>
            </div>

            <div class="stat-card">
                <h2 id="newJobsCount">
                    0
                </h2>
                <p>New Today</p>
            </div>

            <div class="stat-card">
                <h2 id="avgSalary">
                    —
                </h2>
                <p>Avg Salary</p>
            </div>

        </section>


        <!-- SEARCH -->

        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search jobs, company, technology..."
                class="search-input"
            />

        </section>


        <!-- FILTERS -->

        <section class="filters-section">

            <h3 class="filters-title">
                Filter Jobs
            </h3>

            <div class="filter-chips">

                <button
                    class="filter-chip"
                    data-filter="business analyst"
                >
                    BA
                </button>

                <button
                    class="filter-chip"
                    data-filter="program manager"
                >
                    Program Manager
                </button>

                <button
                    class="filter-chip"
                    data-filter="erp"
                >
                    ERP
                </button>

                <button
                    class="filter-chip"
                    data-filter="delivery"
                >
                    Delivery
                </button>

                <button
                    class="filter-chip"
                    data-filter="pmo"
                >
                    PMO
                </button>

                <button
                    class="filter-chip"
                    data-filter="transformation"
                >
                    Transformation
                </button>

                <button
                    class="filter-chip"
                    data-filter="technology"
                >
                    Technology
                </button>

                <button
                    class="filter-chip"
                    data-filter="workday"
                >
                    Workday
                </button>

                <button
                    class="filter-chip"
                    data-filter="sap"
                >
                    SAP
                </button>

            </div>

        </section>


        <!-- JOBS -->

        <section class="jobs-section">

            <div
                class="jobs-container"
                id="jobsContainer"
            >

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
